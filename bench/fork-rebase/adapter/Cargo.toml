[package]
name = "fork-rebase-adapter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
iceberg = { version = "0.10.1", path = "../candidate/iceberg" }
iceberg-old = { package = "iceberg", path = "../../../third_party/iceberg" }
iceberg-storage-opendal = { version = "0.10.1", path = "../candidate/iceberg-storage-opendal" }
reqsign-aws-v4 = "3.0.0"
reqsign-core = "3.0.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
bytes = "1"
http = "1"
