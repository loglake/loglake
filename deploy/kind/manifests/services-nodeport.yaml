# NodePort fronts for the chart-managed Services so kind's
# extraPortMappings can route host:8088 → ingester (OTLP) and host:8089 →
# query-server without a kubectl port-forward.
#
# Applied AFTER `helm install` because they select on the chart's
# component labels.

apiVersion: v1
kind: Service
metadata:
  name: loglake-ingester-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loglake
    app.kubernetes.io/instance: loglake
    app.kubernetes.io/component: ingester
  ports:
    - name: ingest
      port: 8088
      targetPort: 8088
      nodePort: 30088
---
apiVersion: v1
kind: Service
metadata:
  name: loglake-query-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loglake
    app.kubernetes.io/instance: loglake
    app.kubernetes.io/component: query
  ports:
    - name: http
      port: 8089
      targetPort: 8089
      nodePort: 30089
