apiVersion: v2
name: loglake
description: |
  loglake — an OTLP-native log analytics platform in Rust, built on
  Parquet v2 + Apache Iceberg + DataFusion. One chart deploys the three
  data-plane pods (ingester, compactor, query-server); per-service
  `enabled` toggles let customers turn off components they don't need.
type: application
version: 0.2.0
appVersion: "0.2.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/loglake/loglake
sources:
  - https://github.com/loglake/loglake
maintainers:
  - name: limnion-ai
    url: https://github.com/limnion-ai
keywords:
  - logs
  - observability
  - iceberg
  - parquet
annotations:
  category: Analytics
