[package]
name = "loglake-openapi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Emit the committed OpenAPI 3.1 specs for the loglake HTTP servers."

[[bin]]
name = "loglake-openapi"
path = "src/main.rs"

[dependencies]
loglake-ingest = { workspace = true }
loglake-query-server = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
utoipa = { workspace = true }
# `serde_yaml` (not utoipa's `yaml` feature) so the YAML dependency stays out of
# the shipped server binaries — see the workspace `utoipa` comment.
serde_yaml = "0.9"

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
